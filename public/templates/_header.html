<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nelvana - SSH Container Gateway</title>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="live-dot"></span>nel<span class="accent">vana</span></a>
    <nav class="nav-right">{{ safe nav_right }}</nav>
  </div>
  <style>
    :root {
        --bg: #0a0e0d;
        --bg-raised: #101614;
        --border: #222e2a;
        --green: #4afa96;
        --green-dim: #2d8c5a;
        --amber: #ffb054;
        --red: #ff6363;
        --text: #e0ece4;
        --text-dim: #a9c0b6;
        --mono: "Menlo", "Consolas", "Liberation Mono", monospace;
        }

        * {
        box-sizing: border-box;
        }

        html, body {
        margin: 0;
        padding: 0;
        }

        body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 15px;
        line-height: 1.5;
        background-image:
            linear-gradient(rgba(74, 250, 150, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(74, 250, 150, 0.05) 1px, transparent 1px);
        background-size: 42px 42px;
        }

        a {
        color: var(--green);
        text-decoration: none;
        }
        a:hover {
        text-decoration: underline;
        }

        .mono { font-family: var(--mono); }
        .dim { color: var(--text-dim); }
        .accent { color: var(--green); }
        .hidden { display: none !important; }

        /* --- top bar --- */

        .topbar {
        border-bottom: 1px solid var(--border);
        background: rgba(10, 14, 13, 0.9);
        position: sticky;
        top: 0;
        z-index: 10;
        }
        .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        }
        .brand {
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
        }
        .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 13px;
        }
        .nav-user {
        color: var(--text-dim);
        padding-right: 4px;
        border-right: 1px solid var(--border);
        margin-right: 4px;
        }

        .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--green);
        display: inline-block;
        box-shadow: 0 0 0 0 rgba(74, 250, 150, 0.5);
        animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(74, 250, 150, 0.5); }
        50% { box-shadow: 0 0 0 5px rgba(74, 250, 150, 0); }
        }

        /* --- buttons --- */

        .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-raised);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
        }
        .btn:hover { border-color: var(--green-dim); }
        .btn-primary {
        background: var(--green);
        color: #06120b;
        border-color: var(--green);
        }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-ghost { background: var(--bg-raised); }
        .btn-sm { padding: 8px 12px; font-size: 12px; }
        .btn-xs { padding: 6px 10px; font-size: 11px; }
        .btn-block { width: 100%; }
        .btn-stop {
        color: #ffd6d6;
        border-color: rgba(255, 99, 99, 0.5);
        background: rgba(255, 99, 99, 0.18);
        }
        .btn-stop:hover { background: rgba(255, 99, 99, 0.28); }
        .btn-link {
        background: none;
        border: none;
        color: var(--text-dim);
        font-family: var(--mono);
        cursor: pointer;
        font-size: 13px;
        padding: 0;
        }
        .btn-link:hover { color: var(--red); text-decoration: underline; }
        form.inline { display: inline; }

        /* --- landing --- */

        .hero {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px;
        text-align: center;
        }
        .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        background: var(--bg-raised);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--green);
        margin-bottom: 14px;
        }
        .wordmark { font-size: 42px; margin: 0 0 14px; }
        .lede { color: var(--text-dim); margin-bottom: 28px; }
        .cta-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 28px 0;
        flex-wrap: wrap;
        }
        .feature-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 32px;
        text-align: left;
        }
        .feature {
        border: 1px solid var(--border);
        background: rgba(16, 22, 20, 0.6);
        border-radius: 8px;
        padding: 16px;
        }
        .feature h3 { margin: 0 0 6px; font-size: 14px; }
        .feature p { margin: 0; color: var(--text-dim); font-size: 13px; }

        /* --- terminal chrome --- */

        .terminal-chrome {
        border: 1px solid var(--border);
        background: rgba(16, 22, 20, 0.9);
        border-radius: 8px;
        overflow: hidden;
        text-align: left;
        }
        .chrome-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.3);
        border-bottom: 1px solid var(--border);
        }
        .c-dot { width: 10px; height: 10px; border-radius: 999px; }
        .c-dot.red { background: rgba(255, 99, 99, 0.7); }
        .c-dot.amber { background: rgba(255, 176, 84, 0.7); }
        .c-dot.green { background: rgba(74, 250, 150, 0.7); }
        .chrome-title { margin-left: 8px; font-size: 12px; color: var(--text-dim); }
        .chrome-body { padding: 24px; }
        .boot-demo .chrome-body p { margin: 4px 0; font-size: 13px; }

        /* --- auth pages --- */

        .auth-wrap {
        max-width: 440px;
        margin: 48px auto;
        padding: 0 20px;
        }
        .auth-wrap h1 { margin: 0 0 4px; font-size: 20px; }
        .sub { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
        .form { display: flex; flex-direction: column; gap: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-dim);
        }
        .field input, .field select {
        font-family: var(--mono);
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 14px;
        }
        .field input:focus, .field select:focus {
        outline: none;
        border-color: var(--green);
        }
        .password-wrap { position: relative; display: flex; }
        .password-wrap input { flex: 1; padding-right: 56px; }
        .toggle-password {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 11px;
        cursor: pointer;
        text-transform: uppercase;
        }
        .hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 4px; }
        .alert {
        border: 1px solid rgba(255, 99, 99, 0.3);
        background: rgba(255, 99, 99, 0.1);
        color: var(--red);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 4px;
        }

        /* --- dashboard --- */

        .dashboard {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 20px 60px;
        }
        .dash-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        }
        .dash-head h1 { margin: 0 0 4px; font-size: 19px; }
        .dash-actions { display: flex; gap: 8px; }

        .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 20px;
        }
        .stat-card {
        border: 1px solid var(--border);
        background: rgba(16, 22, 20, 0.7);
        border-radius: 8px;
        padding: 14px 16px;
        }
        .stat-label {
        margin: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--text-dim);
        }
        .stat-value { margin: 6px 0 0; font-size: 24px; font-weight: 700; }
        .stat-value.accent { color: var(--green); }

        .table-wrap {
        border: 1px solid var(--border);
        background: rgba(16, 22, 20, 0.6);
        border-radius: 8px;
        overflow: hidden;
        overflow-x: auto;
        }
        .sessions-table { width: 100%; border-collapse: collapse; }
        .sessions-table th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(224, 236, 228, 0.85);
        background: rgba(0, 0, 0, 0.2);
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        }
        .sessions-table th.right, .sessions-table td.right { text-align: right; }
        .sessions-table td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        vertical-align: middle;
        }
        .sessions-table tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
        .sessions-table tr:last-child td { border-bottom: none; }
        .sessions-table td.truncate {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        }
        .muted { color: var(--text-dim); font-size: 12px; }
        .empty-row td { text-align: center; color: var(--text-dim); padding: 36px 16px; }

        .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        }
        .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.8;
        }
        .badge-running {
        color: var(--green);
        background: rgba(74, 250, 150, 0.1);
        border-color: rgba(74, 250, 150, 0.3);
        }
        .badge-stopped {
        color: #d7e6df;
        background: rgba(255, 255, 255, 0.08);
        }

        /* --- modal --- */

        .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
        }
        .modal {
        width: 100%;
        max-width: 420px;
        background: var(--bg-raised);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
        }
        .modal h2 { margin: 0 0 16px; font-size: 16px; }
        .modal form { display: flex; flex-direction: column; gap: 14px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
        .form-error {
        color: var(--red);
        font-size: 12px;
        margin: 0;
        }

        /* --- responsive --- */

        @media (max-width: 760px) {
        .feature-grid { grid-template-columns: 1fr; }
        .grid-2 { grid-template-columns: 1fr; }
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .dash-actions { width: 100%; }
        .dash-actions .btn { flex: 1; }

        .sessions-table thead { display: none; }
        .sessions-table, .sessions-table tbody, .sessions-table tr, .sessions-table td {
            display: block;
            width: 100%;
        }
        .sessions-table tr {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }
        .sessions-table td {
            border: none;
            padding: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .sessions-table td.truncate {
            max-width: none;
            white-space: normal;
            word-break: break-all;
        }
        .sessions-table td::before {
            content: attr(data-label);
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }
        /* keep label-left/value-right on every row, including Action */
        .sessions-table td.right {
            text-align: right;
        }
        .empty-row td::before { content: none; }
        .empty-row td { display: block; text-align: center; }

        .sessions-table td.right form.stop-form {
            width: 100%;
            max-width: 180px;
        }
        .sessions-table .btn-stop {
            width: 100%;
            padding: 10px 14px;
            font-size: 12px;
        }
        }
  </style>
</header>
<main class="page">
